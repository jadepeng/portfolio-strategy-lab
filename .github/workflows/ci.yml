name: Portfolio strategy regression

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all strategy, data gate, ledger, and intraday tests
        run: python -m pytest tests -q
      - name: Rebuild frozen research dashboards via semantic strategy API
        run: |
          python scripts/build_v21_dashboard.py
          python scripts/build_v22_dashboard.py

  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check client JavaScript syntax
        run: |
          node --check web/v21.js
          node --check web/ptms.js
      - name: Exercise dashboard and trading console interactions
        run: |
          node tests/dashboard_smoke.cjs
          node tests/ptms_smoke.cjs
